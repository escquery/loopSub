<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>loopSub 字幕条</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="floatbar">
  <div id="bar">
    <div id="drag-handle" data-tauri-drag-region title="拖动移动位置"></div>
    <div id="controls">
      <button data-act="prev_sentence" title="上一句 (↑)">⏮</button>
      <button data-act="toggle_pause" id="fb-play" title="播放/暂停 (Space)">⏸</button>
      <button data-act="next_sentence" title="下一句 (↓)">⏭</button>
      <span class="sep"></span>
      <button data-act="sentence_loop" data-flag="loop" title="单句循环 (Enter)">🔁</button>
      <button data-act="follow_mode" data-flag="follow" title="跟读模式 (R)">🗣</button>
      <button data-act="toggle_translation" data-flag="zh" title="译文显隐 (T)">译</button>
      <button data-act="copy_current" title="复制当前句英文 (V 后 Ctrl+C)">📋</button>
      <span class="sep"></span>
      <button data-act="toggle_panel" title="主面板收放 (S)">☰</button>
    </div>
    <div id="subs">
      <div id="sub-en" class="sub-line"></div>
      <div id="sub-zh" class="sub-line zh"></div>
    </div>
  </div>
  <script src="floatbar.js"></script>
</body>
</html>

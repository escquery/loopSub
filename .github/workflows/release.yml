name: Release

# 触发方式：
#   1. 推送版本 tag：git tag v0.1.0 && git push origin v0.1.0
#   2. Actions 页面手动 Run workflow（需填 tag）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v0.1.0）'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write # 创建 GitHub Release 并上传安装包

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel # Intel runner（macos-13 已下线）
            target: x86_64-apple-darwin
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- 随包携带外部程序（下载到 src-tauri/resources/，bundle.resources 释放） ----
      # Windows：libmpv-2.dll（shinchiro mpv-dev 包，GitHub releases 动态发现最新版）
      #         + ffmpeg/ffprobe（gyan.dev 静态单 exe）
      - name: Bundle libmpv & ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\resources | Out-Null
          # ffmpeg + ffprobe
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          7z x ffmpeg.zip
          Copy-Item "ffmpeg-*-essentials_build\bin\ffmpeg.exe" src-tauri\resources\
          Copy-Item "ffmpeg-*-essentials_build\bin\ffprobe.exe" src-tauri\resources\
          # libmpv：mpv-dev 开发包（含 libmpv-2.dll，进程内嵌入）
          $rel = Invoke-RestMethod "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "未在 shinchiro/mpv-winbuild-cmake 最新 release 找到 mpv-dev 资产" }
          Write-Host "libmpv: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv_dev
          $dll = Get-ChildItem mpv_dev -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "mpv-dev 包内未找到 libmpv-2.dll" }
          Copy-Item $dll.FullName src-tauri\resources\

      # macOS：按目标架构携带 libmpv 与静态 ffmpeg/ffprobe；ARM 不依赖 Rosetta 2。
      - name: Bundle libmpv & ffmpeg (macOS native)
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then arch=arm64; else arch=amd64; fi
          for tool in ffmpeg ffprobe; do
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
              -o "$tool.zip" \
              "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$tool.zip"
            unzip -jo "$tool.zip" "$tool" -d src-tauri/resources/
          done
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe

          # media-kit 的 LGPL 配置 libmpv（含完整依赖 dylib）；给每个库补同目录
          # rpath，避免原构建机的 Nix rpath 在用户机器上失效。
          libmpv_release=v0.7.2
          libmpv_package=libmpv-libs_v0.7.2_macos-$arch-video-default
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            -o libmpv.tar.gz \
            "https://github.com/media-kit/libmpv-darwin-build/releases/download/$libmpv_release/$libmpv_package.tar.gz"
          tar -xzf libmpv.tar.gz --strip-components=1 -C src-tauri/resources/
          for dylib in src-tauri/resources/*.dylib; do
            if ! otool -l "$dylib" | grep 'path @loader_path ' >/dev/null; then
              install_name_tool -add_rpath @loader_path "$dylib"
            fi
            codesign --force --sign - "$dylib"
          done
          codesign --force --sign - src-tauri/resources/ffmpeg
          codesign --force --sign - src-tauri/resources/ffprobe

          file src-tauri/resources/libmpv.dylib src-tauri/resources/ffmpeg src-tauri/resources/ffprobe
          src-tauri/resources/ffmpeg -version
          src-tauri/resources/ffprobe -version

      # 纯静态前端（src/*.html|js|css + withGlobalTauri），无 node 构建步骤；
      # tauri-action 检测到无 package.json 时自动使用 cargo tauri build。
      - name: Build & upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseName: "loopSub ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            ## 安装
            - **Windows**：`.msi` 或 `-setup.exe`（NSIS，当前用户安装，无需管理员），已内置 libmpv 与 ffmpeg，开箱即用
            - **macOS**：`.dmg`（Apple Silicon 用 aarch64，Intel 用 x64），已内置同架构 libmpv、ffmpeg 与 ffprobe，开箱即用

            ## 外部依赖
            未随包携带的程序可在 loopSub 设置页「外部程序」中指定所在目录，或加入 PATH。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

# macOS libmpv 使用 media-kit/libmpv-darwin-build 的 LGPL video-default 构建；
# 更新版本时需同时更新 libmpv_release 与 libmpv_package 中的版本号。

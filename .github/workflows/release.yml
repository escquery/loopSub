name: Release

# 触发方式：
#   1. 推送版本 tag：git tag v0.1.0 && git push origin v0.1.0
#   2. Actions 页面手动 Run workflow（需填 tag）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v0.1.0）'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write # 创建 GitHub Release 并上传安装包

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-13 # Intel Mac
            target: x86_64-apple-darwin
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- 随包携带外部程序（下载到 src-tauri/resources/，bundle.resources 释放） ----
      # Windows：libmpv-2.dll（shinchiro mpv-dev 包，GitHub releases 动态发现最新版）
      #         + ffmpeg/ffprobe（gyan.dev 静态单 exe）
      - name: Bundle libmpv & ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\resources | Out-Null
          # ffmpeg + ffprobe
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          7z x ffmpeg.zip
          Copy-Item "ffmpeg-*-essentials_build\bin\ffmpeg.exe" src-tauri\resources\
          Copy-Item "ffmpeg-*-essentials_build\bin\ffprobe.exe" src-tauri\resources\
          # libmpv：mpv-dev 开发包（含 libmpv-2.dll，进程内嵌入）
          $rel = Invoke-RestMethod "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "未在 shinchiro/mpv-winbuild-cmake 最新 release 找到 mpv-dev 资产" }
          Write-Host "libmpv: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv_dev
          $dll = Get-ChildItem mpv_dev -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "mpv-dev 包内未找到 libmpv-2.dll" }
          Copy-Item $dll.FullName src-tauri\resources\

      # macOS：ffmpeg/ffprobe（evermeet 静态构建，x86_64；ARM Mac 经 Rosetta 2 运行）。
      # libmpv 无可靠 macOS 静态构建源，需用户 brew install mpv（dylib 走系统搜索路径加载）。
      - name: Bundle ffmpeg (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p src-tauri/resources
          curl -fL -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"
          unzip -o ffmpeg.zip -d src-tauri/resources/
          curl -fL -o ffprobe.zip "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip"
          unzip -o ffprobe.zip -d src-tauri/resources/
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe

      # 纯静态前端（src/*.html|js|css + withGlobalTauri），无 node 构建步骤；
      # tauri-action 检测到无 package.json 时自动使用 cargo tauri build。
      - name: Build & upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseName: "loopSub ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            ## 安装
            - **Windows**：`.msi` 或 `-setup.exe`（NSIS，当前用户安装，无需管理员），已内置 libmpv 与 ffmpeg，开箱即用
            - **macOS**：`.dmg`（Apple Silicon 用 aarch64，Intel 用 x64），已内置 ffmpeg；**libmpv 需自行安装**：`brew install mpv`

            ## 外部依赖
            未随包携带的程序可在 loopSub 设置页「外部程序」中指定所在目录，或加入 PATH。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

# TODO（后续迭代）：macOS 的 libmpv 随包携带
#   无可靠静态构建源（stolendata 已不可用）；可选方案：CI 里 brew install mpv 后
#   用 dylibbundler 收集依赖 dylib 一并打进 .app，或引导用户 brew install mpv（现状）。

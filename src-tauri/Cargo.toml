[package]
name = "loopsub"
version = "0.1.0"
description = "Subtitle-driven language learning companion for mpv"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "loopsub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
dirs = "5"

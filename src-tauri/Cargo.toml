[package]
name = "loopsub"
version = "0.1.0"
description = "Subtitle-driven language learning companion for mpv"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "loopsub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
dirs = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
# libmpv 运行时 dlopen（embed 模式）
libloading = "0.8"

# Windows 窗口召回（SetWindowPos 提升 mpv 窗口）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
